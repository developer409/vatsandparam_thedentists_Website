<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile | Vats & Param</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="prof-container">
        <!-- Left Side: Image -->
        <aside class="prof-image-side" id="doctor-image-container">
            <img src="" alt="" id="doctor-image">
        </aside>

        <!-- Right Side: Content -->
        <main class="prof-content-side">
            <a href="index.html#team" class="prof-back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Team
            </a>

            <div class="vaayu-card vaayu-card--header">
                <div class="vaayu-badge-row">
                    <span class="vaayu-badge" id="doctor-spec-badge">Dental Specialist</span>
                    <span class="vaayu-badge vaayu-badge--success" id="doctor-exp-badge">Verified Expert</span>
                </div>
                <h1 class="prof-name" id="doctor-name"></h1>
                <span class="prof-role" id="doctor-role"></span>
                <div class="vaayu-quick-tags" id="vaayu-tags">
                    <!-- Dynamic tags will be added here or statically -->
                </div>
            </div>

            <div class="vaayu-grid">
                <section class="vaayu-card vaayu-card--main">
                    <div class="vaayu-section-header">
                        <div class="vaayu-icon-box">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        </div>
                        <span class="prof-section-title">Introduction</span>
                    </div>
                    <div class="prof-text" id="doctor-intro"></div>
                </section>

                <div class="vaayu-secondary-column">
                    <section class="vaayu-card vaayu-card--small">
                        <div class="vaayu-section-header">
                            <span class="prof-section-title">Background</span>
                        </div>
                        <div class="vaayu-info-item">
                            <label>Education</label>
                            <p id="doctor-education"></p>
                        </div>
                        <div class="vaayu-info-item">
                            <label>Experience</label>
                            <p id="doctor-experience"></p>
                        </div>
                    </section>

                    <section class="vaayu-card vaayu-card--small">
                        <div class="vaayu-section-header">
                            <span class="prof-section-title">Consultation</span>
                        </div>
                        <div class="vaayu-info-item">
                            <label>Mode</label>
                            <p>In-Clinic & Video</p>
                        </div>
                        <div class="vaayu-info-item">
                            <label>Languages</label>
                            <p id="doctor-languages">English, Hindi, Kannada</p>
                        </div>
                    </section>
                </div>
            </div>

            <section class="vaayu-card vaayu-card--philosophy">
                <div class="vaayu-section-header">
                    <div class="vaayu-icon-box vaayu-icon-box--gold">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                    <span class="prof-section-title">Clinical Philosophy</span>
                </div>
                <div class="prof-text" id="doctor-philosophy"></div>
            </section>
        </main>
    </div>

    <!-- Video Modal -->
    <div class="video-modal" id="video-modal">
        <div class="video-modal__content">
            <div class="video-modal__close" id="modal-close">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
                Close
            </div>
            <iframe id="video-iframe" width="100%" height="100%" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script src="assets/js/doctor-profiles.js"></script>
</body>
</html>
